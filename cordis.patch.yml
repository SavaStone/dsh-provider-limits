# dsh-provider-limits bundle patch
#
# This is the `dsh.bundle.patch` layer of the package. When the plugin is
# installed into a profile:
#
#   dsh plugin --profile <name> add <path-or-package>
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-provider-limits` to the bundle stack.
# The profile boot then merges this patch — a single `insert` of the plugin row
# — exactly like a manual mount line in the profile's own cordis.patch.yml.
# No profile file edits are needed.
#
# The row id is stable and distinct, so a second install cannot silently
# double-mount: a duplicate row id fails loudly at the loader.
- insert:
    - id: provider-limits
      name: 'dsh-provider-limits'
